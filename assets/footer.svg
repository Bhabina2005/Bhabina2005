<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="100%" height="90" fill="none">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0717"/>
      <stop offset="50%" stop-color="#140f2e"/>
      <stop offset="100%" stop-color="#0a0717"/>
    </linearGradient>

    <linearGradient id="footerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </linearGradient>

    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="90" rx="14" fill="url(#footerBg)"/>
  <rect width="900" height="90" rx="14" stroke="#7C3AED" stroke-opacity="0.3" stroke-width="1" fill="none"/>

  <!-- Top Accent Line -->
  <line x1="100" y1="2" x2="800" y2="2" stroke="url(#footerLine)" stroke-width="1.5"/>

  <!-- Subtle glow spot -->
  <circle cx="450" cy="45" r="40" fill="#7C3AED" opacity="0.15" filter="url(#fGlow)"/>

  <!-- Center Text -->
  <text x="450" y="42" text-anchor="middle" fill="#EDE9FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="0.3">
    ⚡ Built with passion, dedication, and precision • <tspan fill="#C4B5FD" font-weight="700">Bhabina Babu</tspan>
  </text>

  <text x="450" y="64" text-anchor="middle" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="0.5">
    Bengaluru, India • Open for Software Development Opportunities
  </text>
</svg>
