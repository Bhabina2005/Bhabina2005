<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0717"/>
      <stop offset="45%" stop-color="#140f2e"/>
      <stop offset="100%" stop-color="#1f103d"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C4B5FD" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="pillGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGradient)"/>
  <rect width="900" height="240" rx="16" stroke="url(#badgeBorder)" stroke-width="1.5" fill="none"/>

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="40" r="90" fill="#7C3AED" opacity="0.22" filter="url(#softGlow)"/>
  <circle cx="800" cy="190" r="110" fill="#4C1D95" opacity="0.28" filter="url(#softGlow)"/>
  <circle cx="450" cy="120" r="70" fill="#A78BFA" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Decorative Tech Wave / Grid Lines -->
  <path d="M -20 180 Q 200 130 450 180 T 920 160" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="2" fill="none"/>
  <path d="M -20 195 Q 220 145 470 195 T 920 175" stroke="#C4B5FD" stroke-opacity="0.15" stroke-width="1.5" fill="none"/>

  <!-- Geometric Accent Dots / Stars -->
  <circle cx="760" cy="50" r="2" fill="#C4B5FD" opacity="0.8"/>
  <circle cx="820" cy="75" r="1.5" fill="#EDE9FE" opacity="0.6"/>
  <circle cx="700" cy="70" r="1.5" fill="#A78BFA" opacity="0.5"/>
  <polygon points="160,50 163,56 169,56 164,60 166,66 160,62 154,66 156,60 151,56 157,56" fill="#C4B5FD" opacity="0.4"/>
  <polygon points="785,130 787,134 792,134 788,137 789,142 785,139 781,142 782,137 778,134 783,134" fill="#C4B5FD" opacity="0.35"/>

  <!-- Code Tag Elements -->
  <g transform="translate(60, 48)">
    <rect width="138" height="26" rx="13" fill="#7C3AED" fill-opacity="0.18" stroke="#7C3AED" stroke-opacity="0.4"/>
    <circle cx="14" cy="13" r="4" fill="#10B981"/>
    <text x="26" y="17" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">OPEN TO WORK</text>
  </g>

  <!-- Name Header -->
  <text x="60" y="118" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    Bhabina Babu
  </text>

  <!-- Subtitle -->
  <text x="60" y="152" fill="#EDE9FE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="500" letter-spacing="0.2">
    Aspiring Software Developer <tspan fill="#7C3AED">|</tspan> Full Stack Developer
  </text>

  <!-- Details Row (Pills) -->
  <g transform="translate(60, 178)">
    <!-- Pill 1: Degree & Department -->
    <rect x="0" y="0" width="220" height="30" rx="8" fill="#1E1B4B" fill-opacity="0.6" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1"/>
    <text x="12" y="19" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      🎓 B.E. Information Science
    </text>

    <!-- Pill 2: College -->
    <rect x="230" y="0" width="250" height="30" rx="8" fill="#1E1B4B" fill-opacity="0.6" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1"/>
    <text x="242" y="19" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      🏛️ Gopalan College of Engg. (GCEM)
    </text>

    <!-- Pill 3: Location -->
    <rect x="490" y="0" width="145" height="30" rx="8" fill="#1E1B4B" fill-opacity="0.6" stroke="#7C3AED" stroke-opacity="0.5" stroke-width="1"/>
    <text x="502" y="19" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
      📍 Bengaluru, India
    </text>
  </g>

  <!-- Right Decorative Emblem / Tech Badge -->
  <g transform="translate(735, 90)">
    <circle cx="45" cy="45" r="48" fill="#7C3AED" fill-opacity="0.15" stroke="#7C3AED" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="38" fill="#140F2E" stroke="#C4B5FD" stroke-opacity="0.3" stroke-width="1"/>
    <text x="45" y="40" text-anchor="middle" fill="#FFFFFF" font-family="Courier New, monospace" font-size="20" font-weight="bold">&lt;/&gt;</text>
    <text x="45" y="58" text-anchor="middle" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="9" font-weight="600" letter-spacing="1">DEV</text>
  </g>
</svg>
